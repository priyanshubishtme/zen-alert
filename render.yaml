# render.yaml — Render Blueprint for ZenAlert
# https://render.com/docs/blueprint-spec
#
# Use: Connect this repo to Render and it will auto-detect this file.
# FastAPI serves both the API and the static frontend from a single service.

services:
  - type: web
    name: zenalert-api
    runtime: python
    region: oregon  # Change to your preferred region
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGINS
        # Set this to your Render URL and any custom domains (comma-separated).
        # Example: https://zenalert-api.onrender.com,https://zenalert.yourdomain.com
        value: ""
      - key: PYTHON_VERSION
        value: "3.11.9"
